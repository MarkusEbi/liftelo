 const tlc=g?g.days.map((id,i)=>{const t=tById(id),cur=nd&&i==nd.i;return `<div class="trow"><div class="tn ${cur?"cur":""}">${i+1}</div><div class="card" ${t?`onclick="detail(${t.id})"`:""}>${t?`<div class="row"><div style="flex:1;min-width:0"><b style="font-size:18px">${t.name}</b>${doneToday(t)?' <span style="color:var(--or)">✓</span>':""}<div class="sub">${t.items.length} Übungen · ~${estMin(t)} Min</div><div class="chs">${musclesOf(t).map(m=>`<span>${m}</span>`).join("")}</div></div><span class="sub" style="font-size:22px">›</span></div>`:`<b style="font-size:18px">Ruhetag 🌙</b><div class="sub">Erholung</div>`}</div></div>`}).join(""):"";
 return `<div class="hdr"><div><div class="sub">${g?`Tag ${nd.i+1} von ${nd.n}`:"Kein Programm"}</div><h1>Training</h1></div><div class="hr"><span class="chipf" onclick="streakInfo()">🔥 ${streak()}</span></div></div>
 <div class="card"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3>Diese Woche</h3><span class="sub">${weekCount(i=>S.logs.some(l=>same(l.date,day(i))))} Trainings</span></div>${weekStrip()}</div>

 ${g?`<div class="tl">${tlc}</div>`:`<div class="card sub">Stelle aus deinen Trainings einen Ablauf mit bis zu 10 Tagen zusammen – ideal für Schichtarbeit.</div>`}
 <h3 style="margin:24px 4px 12px">Alle Trainings</h3><div class="card" style="padding:6px 16px">${S.trainings.map(t=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--bd)" onclick="detail(${t.id})"><div class="ic">🏋️</div><div style="flex:1"><b>${t.name}</b><div class="sub">${t.items.length} Übungen · ~${estMin(t)} Min</div></div><span class="sub" style="padding:6px 10px" onclick="event.stopPropagation();edit(${t.id})">✎</span></div>`).join("")}<div class="row" style="padding:14px 0;gap:8px"><button style="flex:1" onclick="newT()">＋ Neu</button><button style="flex:1" onclick="imp()">Code eingeben</button></div></div>`}function addStarter(){S.trainings.push({id:Date.now(),name:"Ganzkörper Einsteiger",items:[{e:"chest-press",s:3,r:10},{e:"lat",s:3,r:10},{e:"leg-press",s:3,r:10},{e:"crunch",s:3,r:12}]});save();render()}

function maxList(t){return t.items.map(i=>{const e=byId[i.e];const logs=[...S.logs].filter(l=>l.sets.some(s=>s.e==i.e)).sort((a,b)=>a.date-b.date);
 const rm=l=>Math.max(...l.sets.filter(s=>s.e==i.e).map(s=>e1(s.w,s.r,s.rir)));if(!logs.length){const sg=sug(e);return `<div class="card exc">${art(e,64)}<div style="flex:1"><div class="mu">${e.m}</div><div class="nm">${e.name}</div><div class="sub">${i.s} Sätze x ${i.r} Wdh${sg?" · ≈"+fmt(sg)+" kg":""}</div></div></div>`}
 const c=rm(logs.at(-1)),pv=logs.length>1?rm(logs.at(-2)):null,best=Math.max(...logs.map(rm));const pr_=c>=best&&c>0;
 return `<div class="card exc" style="padding:12px 16px">${art(e,64)}<div style="flex:1;min-width:0"><div class="nm" style="font-size:19px">${e.name}</div><div class="sub" style="color:#fff">${pv?fmt(pv)+" kg":""} ${pv?"→":""} ${fmt(c)} kg</div></div>${pr_?`<span class="tro">🏆 ${fmt(c)} kg</span>`:'<span class="sub">⌄</span>'}</div>`}).join("")}
function detail(tid){const t=tById(tid);if(!t)return say("Dieses Training gibt es nicht mehr.");const l=lastLog(t),today=l&&same(l.date,new Date());let h="";
 if(today){const st=streak(),wk=Array.from({length:7},(_,k)=>{const i=6-k,d=day(i),done=S.logs.some(x=>same(x.date,d))||(S.rests||[]).some(r=>same(r,d));return `<div class="wd" style="font-size:16px">${d.toLocaleDateString("de-DE",{weekday:"short"}).replace(".","")}<div class="n ${i==0?"today":""}" style="height:36px;margin-top:8px;background:${done?"var(--or)":"#3a3a3c"}">${done?"✓":"✕"}</div></div>`}).join("");
  h+=`<div class="fl">🔥</div><div class="big">${st}</div><h2 style="text-align:center;margin:6px 0 18px">${st==1?"Streak gestartet!":st+" Tage Streak!"}</h2><div class="card"><div class="week">${wk}</div></div>`}

 h+=`<div class="card"><h3 style="margin-bottom:6px">Trainierte Muskeln</h3><div style="display:flex;justify-content:center">${skel(new Set(l?l.sets.map(s=>byId[s.e].m):musclesOf(t)),260)}</div></div><h2 style="margin:22px 4px 12px">${l?"Maximalkraft ⓘ":"Übungen"}</h2>${maxList(t)}`;
 overlay(t.name.toUpperCase(),h,`<span onclick="navigator.clipboard.writeText('${code(t)}');alert('Code kopiert')" style="font-size:24px">⇪</span>`,

 <div class="chips">${["Alle",...new Set(ALL.map(e=>e.m))].map(m=>`<span class="chip ${m==F.g?"on":""}" onclick="${F===EXS?"EXS":"PK"}.g='${m}';${F===EXS?"EXS":"PK"}.n=60;${chipRf}">${m}</span>`).join("")}</div>

function stats(){const vol=S.logs.reduce((a,l)=>a+l.sets.reduce((b,s)=>b+s.w*s.r,0),0),sets=S.logs.reduce((a,l)=>a+l.sets.length,0);
 const wk=Array.from({length:8},(_,k)=>{const lo=day((7-k)*7+6),hi=day((7-k)*7-1+ (k==7?0:0));return S.logs.filter(l=>l.date>=lo.getTime()&&l.date<hi.getTime()+864e5).reduce((a,l)=>a+l.sets.reduce((b,s)=>b+s.w*s.r,0),0)}),mx=Math.max(...wk,1);
 const prs=ALL.map(e=>{const v=Math.max(0,...S.logs.flatMap(l=>l.sets.filter(s=>s.e==e.id).map(s=>e1(s.w,s.r,s.rir))));return{e,v}}).filter(x=>x.v>0).sort((a,b)=>b.v-a.v).slice(0,6);
 const ws=[...S.weights].sort((a,b)=>a.t-b.t);
 return `<div class="hdr"><h1>Statistiken</h1><div class="hr"><span>🔥 ${streak()}</span></div></div>
 <div class="card" style="margin-top:14px"><div class="stat"><div>${S.logs.length}<span>Trainings</span></div><div>${Math.round(vol/1000*10)/10} t<span>Bewegt</span></div><div>${sets}<span>Sets</span></div></div></div>
 <div class="card"><h3>Volumen pro Woche</h3><div class="bars" style="height:100px">${wk.map(v=>`<i style="height:${Math.max(4,v/mx*95)}px;background:var(--or)"></i>`).join("")}</div><div class="sub">Letzte 8 Wochen</div></div>
 <div class="card"><h3 style="margin-bottom:8px">Persönliche Rekorde</h3>${prs.map(p=>`<div class="row" style="padding:7px 0">${art(p.e,44)}<div style="flex:1;font-weight:700">${p.e.name}</div><span class="tro" style="font-size:16px;background:#1c1c1e">🏆 ${fmt(p.v)} kg</span></div>`).join("")||'<div class="sub">Noch keine Daten</div>'}</div>
 <div class="card"><h3>Körpergewicht</h3>${ws.length?`<div class="bars" style="height:70px">${ws.slice(-10).map(w=>`<i style="height:${Math.max(8,(w.kg-Math.min(...ws.map(x=>x.kg))+3)*10)}px;background:var(--ok)"></i>`).join("")}</div><b style="font-size:24px">${fmt(ws.at(-1).kg)} kg</b>`:'<div class="sub">Tippe auf „Weigh-In“ im Dashboard</div>'}</div>`}

<div class="card"><h3>Kraft-Einstufung</h3><div class="sub" style="margin:8px 0 12px">Vergleich mit den Kraftstandards von strengthlevel.com (Verhältnis zum Körpergewicht). Vier Alltags-Bewegungen: Drücken, Ziehen, Beine, Rumpf. Fülle nur aus, was du kennst – mindestens eine.</div>
<select id="sx"><option value="m" ${P.sex=="m"?"selected":""}>Männlich</option><option value="w" ${P.sex=="w"?"selected":""}>Weiblich</option><option value="x" ${P.sex=="x"?"selected":""}>Keine Angabe</option></select>
<div class="sub" style="margin-top:12px">Körpergewicht (kg)</div><input id="ob" type="number" value="${P.bw||""}">${L}
<div class="sub" style="margin-top:14px">Bei Latzug und Beinpresse: Wie viele Wiederholungen wären noch gegangen? (Reserve)</div><div class="rir" id="rirp">${[0,1,2,3].map(r=>`<span class="${(P.rir??1)==r?"on":""}" onclick="document.querySelectorAll('#rirp span').forEach(s=>s.classList.toggle('on',s===this))">${r}</span>`).join("")}</div></div>
<button class="w" onclick="doOnboard()">Rang berechnen</button>`)}
function doOnboard(){const g=i=>+$("#"+i).value||0,bw=g("ob"),gt=$("#gt").value,gk=g("gk"),sex=$("#sx").value,rir=+$("#rirp .on").textContent;
 if(!gt||!gk||!bw)return alert("Bitte Ziel, Zielgewicht und Körpergewicht angeben.");if(!g("chestw")&&!g("latw")&&!g("legw")&&!g("plankr"))return alert("Bitte mindestens eine Übung eintragen.");
 const P={bw,sex,rir,plankr:g("plankr")};for(const k of["chest","lat","leg"]){P[k+"w"]=g(k+"w");P[k+"r"]=g(k+"r")||1;P[k]=P[k+"w"]>0?e1(P[k+"w"],P[k+"r"],rir):0}
 P.xp0=startXP(bw,sex,{chest:P.chest,lat:P.lat,leg:P.leg,plank:P.plankr});S.profile=P;S.goal={t:gt,kg:gk};if(!S.weights.length)S.weights.push({t:Date.now(),kg:bw});save();const r=RANKS[rankAt(P.xp0)];
 overlay("Dein Rang",`<div class="card" style="text-align:center"><div style="font-size:64px">🛡️</div><h2 style="font-size:28px;color:${r[2]}">${r[0]}</h2><div class="sub">Start-XP ${P.xp0}</div></div><div class="card"><h3 style="margin-bottom:8px">Arbeitsgewichte (8 Wdh, Reserve 2)</h3>${["chest-press","lat","leg-press"].map(i=>sug(byId[i])?`<div class="row" style="padding:6px 0"><div style="flex:1;font-weight:700">${byId[i].name}</div><b style="color:var(--or)">${fmt(sug(byId[i]))} kg</b></div>`:"").join("")}<div class="sub" style="margin-top:8px">Für alle anderen Übungen wird das Gewicht nach deinem ersten Satz berechnet.</div></div><button class="w" onclick="lock=false;closeO()">Los geht's</button>`)}// ---------- Training durchführen ----------
function start(tid,fromProg){const t=tById(tid);ses={tid:t?t.id:0,name:t?t.name:"",t:Date.now(),prog:fromProg,open:0,rd:null,plan:t,b:[]};gate()}
function gate(){overlay(ses.name||"Freies Training",`<div style="padding-top:30px;text-align:center"><h2>Wie fit fühlst du dich heute?</h2><div class="sub" style="margin:10px 0 24px">Schlaf, Stress, Motivation und Muskelkater zählen.</div><div class="row" style="gap:8px">${[1,2,3,4,5].map(n=>`<div class="card" style="flex:1;margin:0;padding:16px 4px;cursor:pointer" onclick="begin(${n})"><div style="font-size:30px;font-weight:800">${n}</div><div class="sub" style="font-size:11px">${["Schlecht","Mäßig","Okay","Gut","Top fit"][n-1]}</div></div>`).join("")}</div><div class="sub" style="margin-top:24px">1 = schlecht, 5 = top fit. Bei 1 oder 2 werden die Gewichte um 15 % bzw. 10 % gesenkt (Empfehlung bei Tagesform unter 50 %). Ab 3 trainierst du wie geplant.</div></div>`)}
function begin(rd){try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}const t=ses.plan;ses.rd=rd;ses.t=Date.now();ses.b=(t?t.items:[]).map(i=>{const e=byId[i.e],w=workW(e,i.r,rd);return{e:i.e,tr:i.r,rest:restOf(i,e),sets:Array.from({length:i.s},()=>({w:w??"",r:i.r,rir:2,d:0}))}});drawS();
 clearInterval(window.zt);window.zt=setInterval(()=>{const z=$("#zt");if(z){const s=Math.floor((Date.now()-ses.t)/1000);z.textContent=`${String(Math.floor(s/60)).padStart(2,"0")} : ${String(s%60).padStart(2,"0")}`}else clearInterval(window.zt)},500)}function drawS(){const done=b=>b.sets.every(s=>s.d);const k=ses.b.findIndex(b=>!done(b));
 overlay(ses.name||"Freies Training",`<div class="seg" style="margin-top:6px">${ses.b.map(b=>`<i class="${done(b)?"on":""}"></i>`).join("")}</div><div style="display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px 18px"><span class="sub">ZEIT <b id="zt" style="color:#fff;font-size:26px">00 : 00</b></span><span class="sub">ÜBUNG <b style="color:#fff;font-size:26px">${(k<0?ses.b.length:k+1)} / ${ses.b.length}</b></span></div>`+
 ses.b.map((b,bi)=>{const e=byId[b.e],o=ses.open===bi,vis=(k=>k<0?b.sets.length:k+1)(b.sets.findIndex(s=>!s.d));return `<div class="card exc" id="ex${bi}" style="flex-wrap:wrap" ><div style="display:flex;align-items:center;gap:14px;width:100%" onclick="ses.open=ses.open===${bi}?-1:${bi};drawS()">${art(e,72)}<div style="flex:1;min-width:0"><div class="mu">${e.m}</div><div class="nm">${e.name}</div><div class="sub">${b.sets.length} Sätze x ${fmt(+b.sets[0].w||0)} kg</div></div><div class="ck ${done(b)?"on":""}">${done(b)?"✓":""}</div></div>
 ${o?`<div style="width:100%;margin-top:6px">${b.sets.map((s,si)=>si>=vis?"":`<div style="margin-top:10px"><div class="sets"><b style="width:18px">${si+1}</b><input type="number" inputmode="decimal" placeholder="kg" value="${s.w}" oninput="ses.b[${bi}].sets[${si}].w=+this.value">kg<input type="number" inputmode="numeric" placeholder="Wdh" value="${s.r}" oninput="ses.b[${bi}].sets[${si}].r=+this.value">Wdh<span class="ck ${s.d?"on":""}" style="margin-left:auto;width:34px;height:34px" onclick="tog(${bi},${si})">${s.d?"✓":""}</span></div><div class="rir"><span class="sub" style="flex:none;background:none;padding:0 6px 0 0">Reserve</span>${[0,1,2,3].map(r=>`<span class="${s.rir==r?"on":""}" onclick="ses.b[${bi}].sets[${si}].rir=${r};drawS()">${r}</span>`).join("")}</div></div>`).join("")}
 <div class="sub" style="margin-top:10px">⏱ Pause ${b.rest}s nach jedem Satz</div>${b.note?`<div class="note">⚙︎ ${b.note}</div>`:""}<button style="margin-top:10px" onclick="ses.b[${bi}].sets.push({...ses.b[${bi}].sets.at(-1),d:0});drawS()">＋ Satz</button></div>`:""}</div>`}).join("")+`<button class="d" onclick="pick(e=>{ses.b.push({e:e.id,tr:10,rest:defRest(e,10),sets:[{w:workW(e,10,ses.rd)??'',r:10,rir:2,d:0}]});drawS()})">＋ Übung hinzufügen</button>`,"",`<button class="w" onclick="finish()">Training beenden</button>`)}
function tog(bi,si){const b=ses.b[bi],s=b.sets[si];s.d^=1;if(s.d){adapt(b,si);const more=b.sets.some(x=>!x.d);startRest(b.rest,more?byId[b.e].name+" – nächster Satz":"nächste Übung");if(!more)ses.open=ses.b.findIndex(x=>!x.sets.every(y=>y.d))}drawS();if(!b.sets.some(x=>!x.d)&&ses.open>=0)setTimeout(()=>document.getElementById("ex"+ses.open)?.scrollIntoView({block:"start",behavior:"smooth"}),60)}
function finish(){const sets=ses.b.flatMap(b=>b.sets.filter(s=>s.d&&s.r>0).map(s=>({e:b.e,w:+s.w||0,r:+s.r,rir:s.rir})));if(!sets.length)return say("Noch kein Satz abgehakt.");ask("Training benennen",ses.name||"Training",n=>doFinish(sets,n))}
function doFinish(sets,n){let tid=ses.tid;if(!tid){tid=Date.now();S.trainings.push({id:tid,name:n||"Training",items:[...new Set(sets.map(s=>s.e))].map(e=>({e,s:sets.filter(s=>s.e==e).length,r:10}))})}
 S.logs.push({tid,name:n||"Training",date:Date.now(),dur:Math.max(60,(Date.now()-ses.t)/1000),sets});if(ses.prog)S.ptr++;save();closeO();detail(tid)}
// ---------- Render ----------
function render(keep){main.innerHTML=[home,training,exs,stats][tab]();
 $("#nav").innerHTML=[["🏠","Home"],["🏃","Training"],["🏋️","Übungen"],["📊","Statistiken"]].map((t,i)=>`<div class="${i==tab?"on":""} ${i==1?"tr":""}" onclick="tab=${i};menu=null;render();main.scrollTop=0"><b>${t[0]}</b>${t[1]}</div>`).join("");
 if(keep){const i=$("#q");i.focus();i.setSelectionRange(99,99)}}
render();
if(!S.profile||!S.goal){lock=true;onboard()}
</script></body></html>
